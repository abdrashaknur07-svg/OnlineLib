<section class="features">

    <h2>🔐 Жүйеге кіру</h2>

    <div class="card"
         style="max-width:450px;margin:auto;">

        <form onsubmit="event.preventDefault(); alert('Кіру жүйесі келесі апталарда қосылады');">

            <input type="email"
                   placeholder="Email"
                   required
                   style="width:100%;padding:15px;margin-bottom:20px;border-radius:10px;">

            <input type="password"
                   placeholder="Құпиясөз"
                   required
                   style="width:100%;padding:15px;margin-bottom:20px;border-radius:10px;">

            <button class="main-btn"
                    type="submit"
                    style="border:none;cursor:pointer;">
                Кіру
            </button>

        </form>

    </div>
