<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тіркелу | OnlineLibrary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="logo">📚 OnlineLibrary</div>
    <nav>
        <a href="index.html">Басты бет</a>
        <a href="books.html">Кітаптар</a>
        <a href="login.html">Кіру</a>
    </nav>
</header>

<section class="features">

    <h2>✨ Жаңа аккаунт ашу</h2>

    <div class="card"
         style="max-width:450px;margin:auto;">

        <form onsubmit="event.preventDefault(); alert('Тіркелу жүйесі келесі апталарда қосылады');">

            <input type="text"
                   placeholder="Аты-жөніңіз"
                   required
                   style="width:100%;padding:15px;margin-bottom:20px;border-radius:10px;">

            <input type="email"
                   placeholder="Email"
                   required
                   style="width:100%;padding:15px;margin-bottom:20px;border-radius:10px;">

            <input type="password"
                   placeholder="Құпиясөз"
                   minlength="8"
                   required
                   style="width:100%;padding:15px;margin-bottom:20px;border-radius:10px;">

            <button type="submit"
                    class="main-btn"
                    style="border:none;cursor:pointer;">
                Тіркелу
            </button>

        </form>

    </div>

</section>

</body>
</html>
